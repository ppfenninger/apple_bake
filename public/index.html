<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bake-off</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header><h1 id="title">Bake-off</h1></header>
  <section class="card">
    <p style="margin-top:0" id="voteLine"><a href="/vote"><b>Vote</b></a> for People's Choice and the other special awards.</p>
    <p><a href="/results"><b>Results</b></a>, live once judging is done, plus past years.</p>
    <p id="signupLine"><a href="/signup"><b>Sign up to judge</b></a></p>
    <p>Judging today? <a href="/here"><b>Check in here</b></a> when you arrive.</p>
    <p class="sub" style="margin-bottom:0"><a href="/checkin">Check-in</a> · <a href="/admin">Organizers</a></p>
  </section>
</main>
<script src="/app.js"></script>
<script>
  api('/api/info').then(i => {
    document.title = i.eventName;
    $('title').textContent = i.eventName;
    if (!i.signupOpen) $('signupLine').classList.add('hidden');
  }).catch(() => {});
</script>
</body>
</html>
